openapi: 3.0.1
info:
  title: Medical Monolith API
  version: 1.0.0
paths:
  /patients:
    get:
      summary: List patients
      responses:
        '200':
          description: OK
    post:
      summary: Create patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientInput'
      responses:
        '201':
          description: Created
  /patients/{id}:
    get:
      summary: Show patient
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
components:
  schemas:
    PatientInput:
      type: object
      properties:
        name:
          type: string
        bornAt:
          type: string
          format: date
      required: [name, bornAt]