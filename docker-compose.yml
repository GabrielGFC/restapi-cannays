version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: db-postgres
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "appuser"]
      interval: 10s
      retries: 5

  app:
    build: .
    container_name: medical-monolith
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - .:/app          # hot‑reload
    command: ["npm", "run", "dev"]

volumes:
  pgdata: